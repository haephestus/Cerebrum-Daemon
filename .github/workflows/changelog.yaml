name: Generate Release Changelog

on:
  push:
    tags:
      - 'v*' # Triggers only when you push tags matching v1.0.0, v2.1.0, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update CHANGELOG.md and create releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to parse conventional commits

      - name: Build Changelog and Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Auto-generates changelog from pull requests/commits
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

